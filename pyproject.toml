[project]
name = "dish-list"
version = "0.1.0"
description = "Anonymous recipe-swiping experiment"
readme = "README.md"
authors = [
    { name = "Steve Freund", email = "sdfreund10@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
